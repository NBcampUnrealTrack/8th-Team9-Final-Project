[/Script/SettingsKit.SKPluginSettings]
; 설정창 조작 탭에서 키를 바꿀 수 있게 할 IMC 목록.
; 이게 비면 조작 탭이 빈 채로 뜬다 — Enhanced Input 은 '사용자 설정에 등록된' IMC 의 매핑만
; 키 프로필에 올리는데, AddMappingContext 의 bNotifyUserSettings 기본값이 false 라
; 게임이 평범하게 IMC 를 넣는 것만으로는 등록이 안 되기 때문이다.
+RebindableMappingContexts=/Game/FallingApart/Input/IMC_Character.IMC_Character

; 설정창 보이스 탭 아래에 게임 전용 "접속자별 음량" 목록을 끼운다.
; 플러그인은 이 게임에만 있는 항목을 몰라도 되고, 게임은 플러그인을 고치지 않아도 된다.
; 자리는 WBP_FASettings 보이스 탭의 Box_VoiceExtra 패널이다.
; WBP 를 안 쓰려면 "/Script/FallingApart.FAVoiceRosterWidget" 로 되돌리면 C++ 임시 레이아웃이 뜬다.
+TabExtensions=(Tab=Voice,WidgetClass="/Game/FallingApart/WBP/WBP_FAVoiceRoster.WBP_FAVoiceRoster_C")

; 마이크 자동 조정. 마이크마다 노이즈 바닥이 달라서 ini 한 세트로 팀 전원을 맞출 수 없다 —
; 사람마다 재서 사람마다 다른 게이트 값을 넣는다(UFAVoiceCalibration).
; 아직 WBP 가 없어 C++ 임시 레이아웃을 그대로 쓴다. WBP 를 만들면 여기 경로만 바꾸면 된다.
+TabExtensions=(Tab=Voice,WidgetClass="/Game/FallingApart/WBP/WBP_FAVoiceCalibration.WBP_FAVoiceCalibration_C")


