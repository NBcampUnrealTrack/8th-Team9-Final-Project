; 마이크 게이트. 엔진 기본값(둘 다 0.08 = 약 -22dBFS)은 웹캠/노트북 마이크에는 너무 높아
; 아무것도 전송되지 않는다. 기획상 속삭임과 '숨죽이기'가 전달돼야 하므로 낮게 잡는다.
; ⚠️ 아직 실측 튜닝 전 임시값이다. 잡음이 너무 새면 NoiseGate 부터 올릴 것.
[ConsoleVariables]
voice.SilenceDetectionThreshold=0.005
voice.MicNoiseGateThreshold=0.0
voice.MicInputGain=5.0

; 엔진 기본값은 0.0 이라 포커스를 잃은 창은 완전 무음이 된다.
; 창 2개 띄워 보이스를 검증하려면 반드시 필요하고, 파티 게임이라 알트탭 중에도
; 목소리가 들리는 편이 맞다고 판단해 1.0 로 둔다.
[Audio]
UnfocusedVolumeMultiplier=1.0

; ---- 근접 보이스 ----
; 마이크 캡처 모듈(Runtime/Online/Voice) 활성화. 엔진 기본값이 false 라 반드시 켜야 한다.
[Voice]
bEnabled=true

; OnlineSubsystem 의 VoiceInterface 를 통해 음성 패킷이 오간다.
; 지금은 세션 없이 Null 서브시스템 + 리슨 서버로 동작하고,
; 서버 담당의 Steam 세션이 붙으면 DefaultPlatformService=Steam 한 줄로 Steam Voice 로 전환된다.
[OnlineSubsystem]
bHasVoiceEnabled=true
MaxLocalTalkers=1
MaxRemoteTalkers=16
; 8인 파티 기준. Steam 전환 시 0.2 권장(엔진 BaseEngine.ini 주석 참고)
VoiceNotificationDelta=0.33

