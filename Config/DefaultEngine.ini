; ⚠️ 마이크 게이트 CVar 은 여기(`[ConsoleVariables]`)에 두지 말 것. 아래 `[SystemSettings]` 가 유일한 자리다.
;
; 이 섹션은 우선순위가 더 높아서(ECVF_SetByConsoleVariablesIni 0x0A > ECVF_SetBySystemSettingsIni 0x05,
; IConsoleManager.h) 같은 CVar 을 양쪽에 두면 아래 튜닝값이 통째로 죽는다.
; 실제로 그렇게 중복돼 있었고, 여기 있던 voice.MicInputGain=5.0 이 int16 샘플을 하드 클리핑시켜
; "크게 말하면 지직거린다" 를 만들고 있었다 (VoiceCaptureWindows.cpp 의 TSampleRef 곱셈이 Clamp 한다).

; 엔진 기본값은 0.0 이라 포커스를 잃은 창은 완전 무음이 된다.
; 창 2개 띄워 보이스를 검증하려면 반드시 필요하고, 파티 게임이라 알트탭 중에도
; 목소리가 들리는 편이 맞다고 판단해 1.0 로 둔다.
[Audio]
UnfocusedVolumeMultiplier=1.0

; ---- 근접 보이스 ----
