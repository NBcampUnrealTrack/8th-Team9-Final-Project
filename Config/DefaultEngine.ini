; ---------------------------------------------------------------------------
; 마이크 노이즈 게이트 (근접 보이스)
; ---------------------------------------------------------------------------
; 오픈 마이크라 키보드·팬·룸 노이즈가 계속 흘러나가던 문제. 아래 CVar 은
; Engine/Source/Runtime/Online/Voice 의 Windows 캡처 경로가 매 버퍼마다 읽는다.
;
; 튜닝 방법 — 콘솔에 `voice.debug.PrintAmplitude 1` 을 치면 현재 마이크 진폭이 찍힌다.
;   1) 아무 말 없이 평소처럼 타이핑 → 그때 찍히는 최댓값이 '노이즈 바닥'
;   2) SilenceDetectionThreshold 를 그 값보다 살짝 위로
;   3) 평소 목소리로 말했을 때 안 잘리는지 확인
;   4) 마지막으로 '가장 크게 지르는' 진폭 × MicInputGain 이 1.0 을 넘지 않는지 확인
; 마이크마다 달라서 팀원별로 값이 다를 수 있다 — 설정 창이 생기면 슬라이더로 뺄 것.
;
; MicInputGain 상한 — 캡처 경로가 int16 샘플에 게인을 곱하면서 FMath::Clamp 로 하드 클리핑한다
; (VoiceCaptureWindows.cpp 의 TSampleRef fixed×float 경로). 즉 '진폭 × 게인 > 1.0' 인 구간은
; 파형 윗부분이 평평하게 잘려서 지직거린다. 받는 쪽 볼륨을 줄여도 안 없어진다 — 이미 뭉개져서 전송된다.
; 목소리가 작다고 게인부터 올리지 말고, SilenceDetectionThreshold 를 먼저 낮출 것.
;
; 2026-08-15 — 음량은 이제 재생 쪽에서 번다. 여기 게인을 더 올리지 말 것.
;   화자별 배수 : UFAVoiceComponent::VoicePlaybackVolume (기본 3.5, BP_FACharacter 에서 조정)
;   사용자 볼륨 : 콘솔 `FAVoice.OutputVolume <배수>` — 게임 중에 말하면서 바로 조절된다.
;                 설정창 '출력 볼륨' 슬라이더가 이 값으로 연결될 예정.
;   현재 값 확인 : `FAVoice.Dump` 의 '출력 볼륨' 줄 (화자별 최종 배수까지 찍힌다)
;
; 2026-08-14 조정 — 직전 값(Silence 0.04 / NoiseGate 0.035 / Gain 1.0)은 게이트가 너무 빡빡했다.
; v1.9.1 패키징 로그에서 로컬 발화 35회 대비 `Available: 0` + `Voice data error` 가 40회 —
; 말하는 도중에 절반 가까이가 전송에서 잘려나갔다("작게 들린다 · 뚝뚝 끊긴다"의 한 축).
[SystemSettings]
; 이 진폭 아래는 아예 전송하지 않는다. 상시 흐르는 룸 노이즈를 끊는 주 수단.
; 0.04 는 보통 목소리의 여린 구간(말끝 · 자음)까지 잘랐다. 노이즈 바닥을 재서 다시 조일 것.
voice.SilenceDetectionThreshold=0.015
; 말 시작을 놓치지 않게 어택은 짧게(ms).
voice.SilenceDetectionAttackTime=5.0
; 릴리즈가 짧으면 말끝이 툭툭 끊긴다(ms).
voice.SilenceDetectionReleaseTime=350.0
; 게이트 — 임계 아래 신호를 눌러준다. 키보드 타건처럼 짧고 센 소리에 효과.
;
; 2026-08-15 — 재생 배수 3.5 를 넣고 나니 "키보드 소리가 들린다"가 나왔다.
; 당연한 결과다. 재생 배수는 목소리와 노이즈를 똑같이 3.5 배 키운다 — 예전에 안 들리던
; 노이즈 바닥이 그대로 올라온 것이다. 게이트로 잡아야 한다.
;
; 두 임계는 서로 다른 일을 한다 (VoiceCaptureWindows.cpp:491, 494):
;   SilenceDetectionThreshold — 이 위여야 '전송'한다
;   MicNoiseGateThreshold     — 이 위여야 '소리를 통과'시킨다 (아래는 0 으로 눌림)
; 게이트를 침묵 임계보다 높게 두면, 전송은 되지만 소리는 눌린 구간이 생긴다 — 노이즈 처리에 유리.
;
; 어택을 늘린 이유: 키보드 타건은 5~20ms 짜리 짧은 충격음이라, 게이트가 다 열리기 전에
; 이미 끝난다. 어택 25ms 면 타건은 대부분 눌리고 수백 ms 인 말소리는 멀쩡히 통과한다.
; 대신 단어 첫머리가 아주 살짝 무뎌진다 — 더 무뎌지면 어택을 15 로 내릴 것.
;
; ※ 두 임계 모두 게인 '이전' 원본 진폭으로 판정한다 (VoiceCaptureWindows.cpp:487,
;   MicLevelDetector.ProcessSample(Temp / 32768.f)). MicInputGain 을 바꿔도 게이트는 안 움직인다.
voice.MicNoiseGateThreshold=0.02
voice.MicNoiseAttackTime=25.0
voice.MicNoiseReleaseTime=200.0
; 게이트를 내린 만큼 남는 여유로 음량을 보상한다.
; 위 경고대로 '최대 진폭 × 게인 > 1.0' 이면 하드 클리핑이다. 1.5 는 진폭 0.66 까지 안전하고,
; 실측(voice.debug.PrintAmplitude 1) 전에는 2.0 을 넘기지 말 것.
voice.MicInputGain=1.5
